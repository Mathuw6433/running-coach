<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Shadow Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#f3f4ef;--pn:#fff;--pn2:#eceee6;--ln:#d9dccf;--tx:#14170f;--mut:#677060;--ac:#4f9a00;--acT:#fff;--wr:#e0710b;--rd:#d63a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d09;--pn:#14170f;--pn2:#1c2016;--ln:#2a3022;--tx:#eef2e6;--mut:#8f9a82;--ac:#c6ff3d;--acT:#0b0d09;--wr:#ffa23d;--rd:#ff6161}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
.hd{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:800}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px}
.btn{background:var(--ac);color:var(--acT);font-weight:600;border-radius:10px;padding:8px 14px;font-size:14px}
.btn2{border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-size:14px;background:var(--pn2)}
.inp{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;width:100%;color:var(--tx)}
.mut{color:var(--mut)}.ac{color:var(--ac)}.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;width:100%;text-align:left;color:var(--mut)}
.nav.on{background:var(--ac);color:var(--acT);font-weight:600}.badge{font:500 11px ui-monospace,monospace;background:var(--pn2);border:1px solid var(--ln);color:var(--ac);padding:2px 8px;border-radius:99px}
.bar{height:8px;background:var(--pn2);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
.md li{margin-left:18px;list-style:disc}.tw{overflow-x:auto}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
:root{--bg:#f3f4fa;--pn:rgba(255,255,255,.72);--pn2:rgba(20,24,40,.05);--ln:rgba(20,24,40,.09);--tx:#12141c;--mut:#6a7085;--ac:#5b3df5;--ac2:#0aa5c0;--acT:#fff;--g:linear-gradient(120deg,#6d4cff,#08b6d4);--glow:0 8px 30px -10px #6d4cff88}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07080d;--pn:rgba(255,255,255,.045);--pn2:rgba(255,255,255,.06);--ln:rgba(255,255,255,.09);--tx:#f1f3fa;--mut:#8a90a6;--ac:#c4ff4d;--ac2:#22e5c4;--acT:#07080d;--g:linear-gradient(120deg,#c4ff4d,#22e5c4);--glow:0 8px 40px -10px #c4ff4d77}}
body{background:radial-gradient(900px 520px at 8% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent),radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--ac2) 15%,transparent),transparent),var(--bg);background-attachment:fixed}
.hd{font-family:'Space Grotesk',sans-serif;text-transform:none;letter-spacing:-.035em;font-weight:700}
.hd.ac,.hd .ac{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--pn);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:22px;box-shadow:inset 0 1px 0 #ffffff12;transition:border-color .25s,transform .25s}.card:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}button.card:hover{transform:translateY(-3px)}
.btn{background:var(--g);border-radius:999px;padding:9px 18px;box-shadow:var(--glow);transition:.2s}.btn:hover{transform:translateY(-1px) scale(1.03)}
.btn2{border-radius:999px;background:var(--pn);transition:.2s}.btn2:hover{border-color:var(--ac)}
.inp{border-radius:14px}.inp:focus{outline:2px solid var(--ac);border-color:transparent}
.nav{border-radius:14px;transition:.2s}.nav:hover{background:var(--pn2);color:var(--tx)}.nav.on{background:var(--g);box-shadow:var(--glow);color:var(--acT)}
aside{-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}.logo{width:42px;height:42px;border-radius:14px;background:var(--g);color:var(--acT);display:grid;place-items:center;font-size:20px;box-shadow:var(--glow)}
.bar{height:7px}.bar>i{background:var(--g);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 60%,transparent);border-radius:9px}
.badge{border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent)}
polyline{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 50%,transparent));stroke-linejoin:round}
tr:hover td{background:var(--pn2)}main>*{animation:up .45s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:9px}
.tip{position:relative}.tip:hover{z-index:20}.tt{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:230px;max-width:70vw;padding:10px 12px;border-radius:12px;font:400 12px/1.4 Inter,sans-serif;letter-spacing:0;text-transform:none;text-align:left;background:var(--tx);color:var(--bg);pointer-events:none;box-shadow:0 10px 30px #0006}.tip:hover>.tt{display:block}
</style></head><body><div id="root" style="height:100%"></div>
<script>
const {useState,useEffect,useRef,useContext}=React,h=htm.bind(React.createElement);
const TABS=[["🏠","Aujourd’hui"],["💬","AI Coach"],["📅","Agenda et Séances"],["🍝","Nutrition"],["💧","Hydratation"],["👤","Profil"],["📊","Statistiques"],["⚙️","Paramètres"]];
const SUGG=["Analyse ma fatigue actuelle","Débriefe ma dernière séance de seuil","Que conseille RunWise sur le volume ?","Programme ma séance de demain"];
const mmss=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const iso=d=>d.toISOString().slice(0,10);
const EVENTS=[[1,"Séance seuil 3×10’","Warmup 15’ facile + 5 lignes droites","3×10’ @ 3:55/km, récup 2’ trot","Retour au calme 10’",16,78],[3,"Sortie longue","Warmup 10’","1h30 progressive 4:50 → 4:25/km","Cooldown 5’",24,95],[5,"VMA 10×400","Warmup 20’ + gammes","10×400 m @ 3:10/km, récup 200 m trot","Cooldown 10’",12,70]].map((e,i)=>({id:i,date:iso(day(e[0])),name:e[1],warmup:e[2],main:e[3],cooldown:e[4],km:e[5],load:e[6]}));
const ACTS=[[-1,"Seuil 3×10’",15.2,"4:12",152,176,82],[-3,"Footing récup",9.1,"5:20",138,151,31],[-5,"VMA 8×1000",14.0,"4:05",158,188,96],[-7,"Sortie longue",24.3,"4:48",146,165,112]].map((a,i)=>({id:"a"+i,date:iso(day(a[0])),name:a[1],km:a[2],pace:a[3],hr:a[4],hrmax:a[5],load:a[6]}));
const LAPS=Array.from({length:15},(_,i)=>i%2?{type:"RECOVERY",label:"Récup",m:400,s:150,pace:"6:15",hr:150+i,max:160,cad:162}:{type:"WORK",label:"Rép "+(i/2+1|0)+1,m:1000,s:245-i,pace:"4:0"+(5-(i%5)),hr:170+i%4,max:182,cad:184});
const VIDS=["Construire son volume sans se blesser","Seuil : le guide complet","VMA : séances clés","Nutrition de l’effort long","Gut-training et glucides","Récupération et sommeil","Préparer un 10 km","Polarisé vs pyramidal","Renforcement du coureur","Gestion de la fatigue","Allure marathon","Hydratation et sodium"].map((t,i)=>({video_id:"M7lc1UVf-VE",title:t,ep:i+1}));
const demoReply=q=>({answer:"**Analyse (mode démo)**\n\nTon TSB est à **−8** : fatigue modérée, compatible avec une séance qualitative demain.\n\n- Séance demain : 5×1000 m à 3:50/km, récup 2’ trot\n- Nutrition : vise 8 g/kg de glucides par jour, soit 60 g/h pendant la séance\n- Hydratation : bois 500 ml d’eau avec électrolytes avant la séance\n- Sommeil : cible 8 h\n\nQuestion reçue : « "+q+" »",tools_used:["get_intervals_wellness","search_runwise_knowledge"],video_references:[{video_id:"M7lc1UVf-VE",start_sec:42,title:"RunWise — Gestion du volume"}]});
const md=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split("\n").map(l=>/^[-•] /.test(l)?`<li>${l.slice(2)}</li>`:l?`<p class="mb-2">${l}</p>`:"").join("");
const Card=p=>h`<div class="card ${p.c||""}">${p.children}</div>`;
const Title=p=>h`<h2 class="hd text-4xl md:text-5xl mb-6">${p.children}</h2>`;
function Chart({lines,h:H=140}){const all=lines.flatMap(l=>l.d),mn=Math.min(...all),mx=Math.max(...all),n=lines[0].d.length;
 const P=l=>l.d.map((v,i)=>`${(i/(n-1))*600},${H-6-((v-mn)/(mx-mn||1))*(H-12)}`).join(" ");
 return h`<svg viewBox="0 0 600 ${H}" class="w-full" style=${{height:H}}>${lines.map(l=>h`<polyline key=${l.n} fill="none" stroke=${l.c} stroke-width="2.5" points=${P(l)}/>`)}</svg>`}

function Coach({api,demo,prefill,clear}){
 const X=useContext(Ctx),{msgs,setM}=X,[v,setV]=useState(""),[busy,setB]=useState(false),[lib,setL]=useState(false),[q,setQ]=useState(""),[play,setP]=useState({}),end=useRef();
 const sid=useRef("s"+Date.now());
 useEffect(()=>{end.current&&end.current.scrollIntoView({behavior:"smooth"})},[msgs,busy]);
 async function send(t){t=(t||v).trim();if(!t||busy)return;setV("");setM(m=>[...m,{r:"u",t}]);setB(true);
  let r=await api("/api/chat",{method:"POST",body:JSON.stringify({message:t,session_id:sid.current})});
  if(!r)r=demoReply(t);setM(m=>[...m,{r:"a",...r}]);setB(false)}
 useEffect(()=>{if(prefill){send(prefill);clear()}},[prefill]);
 const vids=VIDS.filter(x=>x.title.toLowerCase().includes(q.toLowerCase()));
 return h`<div class="h-full flex flex-col relative">
  <div class="flex justify-end p-3"><button class="btn2" onClick=${()=>setL(true)}>🎞️ Bibliothèque RunWise</button></div>
  <div class="flex-1 overflow-y-auto px-4"><div class="max-w-3xl mx-auto pb-6">
   ${!msgs.length&&h`<div class="text-center pt-8 md:pt-16"><div class="text-5xl mb-3">🏃</div><h1 class="hd text-5xl md:text-6xl">Prêt à <span class="ac">performer</span> ?</h1>
    <p class="mut mt-3 mb-8">Ton coach IA connecté à Intervals.icu et à la base RunWise.</p>
    <div class="grid sm:grid-cols-2 gap-3 text-left">${SUGG.map(s=>h`<button key=${s} onClick=${()=>send(s)} class="card hover:opacity-80 font-medium">${s} <span class="ac">→</span></button>`)}</div></div>`}
   ${msgs.map((m,i)=>m.r==="u"?h`<div key=${i} class="flex justify-end my-3"><div class="btn max-w-[85%]" style=${{fontWeight:500}}>${m.t}</div></div>`:
    h`<div key=${i} class="my-4"><div class="flex flex-wrap gap-1 mb-2">${(m.tools_used||[]).map(t=>h`<span key=${t} class="badge">⚙ ${t}</span>`)}</div>
     ${(m.answer||"").split("\n").filter(Boolean).map((l,k)=>{const c=/^[-•] /.test(l)?cat(l):null;return h`<div key=${k} class="flex items-start gap-2 mb-1"><div class="md flex-1" dangerouslySetInnerHTML=${{__html:md(l)}}/>${c&&h`<button class="badge shrink-0" onClick=${()=>X.add(c,l.replace(/^[-•] /,""))}>＋ ${CL[c]}</button>`}</div>`})}
     ${(m.video_references||[]).map((v,j)=>h`<${Card} c="mt-3 max-w-md"><div class="text-sm font-semibold mb-2">▶ ${v.title||"Extrait RunWise"} · à ${mmss(v.start_sec||0)}</div>
      ${play[i+"-"+j]?h`<iframe class="w-full rounded-lg" style=${{aspectRatio:"16/9"}} src=${`https://www.youtube.com/embed/${v.video_id}?start=${v.start_sec||0}&autoplay=1`} allow="autoplay; encrypted-media" allowFullScreen/>`:
      h`<button class="btn w-full" onClick=${()=>setP({...play,[i+"-"+j]:1})}>Lire l’extrait</button>`}<//>`)}</div>`)}
   ${busy&&h`<div class="mut animate-pulse">Le coach réfléchit…</div>`}<div ref=${end}/></div></div>
  <div class="p-3"><div class="max-w-3xl mx-auto flex gap-2 card" style=${{padding:8,borderRadius:99}}>
   <input class="flex-1 bg-transparent outline-none px-3" placeholder="Pose ta question au coach…" value=${v} onChange=${e=>setV(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&send()}/>
   <button class="btn" style=${{borderRadius:99}} onClick=${()=>send()}>Envoyer ➤</button></div></div>
  ${lib&&h`<div class="absolute inset-0 z-20 flex justify-end" style=${{background:"#0008"}} onClick=${()=>setL(false)}><div class="w-full max-w-md h-full overflow-y-auto p-4" style=${{background:"var(--bg)"}} onClick=${e=>e.stopPropagation()}>
   <div class="flex justify-between mb-3"><h3 class="hd text-2xl">Bibliothèque · 52 vidéos</h3><button onClick=${()=>setL(false)}>✕</button></div>
   <input class="inp mb-3" placeholder="Rechercher…" value=${q} onChange=${e=>setQ(e.target.value)}/>
   ${vids.map(x=>h`<${Card} c="mb-2" key=${x.ep}><div class="mut text-xs">Épisode ${x.ep}</div><div class="font-medium">${x.title}</div><//>`)}</div></div>`}</div>`}

function Agenda({go}){
 const X=useContext(Ctx),[sel,setS]=useState(null),[pick,setPick]=useState(null);
 const gcal=e=>{const d=e.date.replace(/-/g,"");return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.name)}&dates=${d}T180000/${d}T193000&details=${encodeURIComponent(e.warmup+" | "+e.main+" | "+e.cooldown)}`};
 const ics=()=>{const b="BEGIN:VCALENDAR\nVERSION:2.0\n"+X.ev.map(e=>`BEGIN:VEVENT\nUID:${e.id}@shadow\nDTSTART:${e.date.replace(/-/g,"")}T180000\nSUMMARY:${e.name}\nEND:VEVENT`).join("\n")+"\nEND:VCALENDAR";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"text/calendar"}));a.download="shadow-coach.ics";a.click()};
 if(sel){const a=sel,tot=LAPS.reduce((s,l)=>s+l.s,0);
  const M=[["Distance",a.km+" km"],["Durée","1:04:12"],["Allure",a.pace+"/km"],["GAP",a.pace+"/km"],["FC moy/max",a.hr+"/"+a.hrmax],["Cadence","178 spm"],["Load",a.load],["TRIMP",96],["Intensité","92 %"],["Découplage","2,8 %"],["Efficacité","1,74"],["Dénivelé","84 m"],["Calories","1 020"]];
  return h`<div><button class="btn2 mb-4" onClick=${()=>setS(null)}>← Retour</button><${Title}>${a.name} · ${a.date}<//>
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 mb-4">${M.map(m=>h`<${Card} key=${m[0]} c="!p-3"><div class="mut text-xs">${m[0]}</div><div class="hd text-2xl">${m[1]}</div><//>`)}</div>
  <${Card} c="mb-4"><div class="font-semibold mb-2">Tours</div><div class="flex h-14 gap-px">${LAPS.map((l,i)=>h`<div key=${i} title=${l.label} style=${{flex:l.s/tot,background:l.type==="WORK"?"var(--ac)":"var(--pn2)",borderRadius:4}}/>`)}</div><//>
  <${Card} c="mb-4 tw"><table><thead><tr>${["#","Type","Label","Dist (m)","Durée","Allure","FC moy","FC max","Cad"].map(x=>h`<th key=${x}>${x}</th>`)}</tr></thead><tbody>${LAPS.map((l,i)=>h`<tr key=${i}><td>${i+1}</td><td>${l.type}</td><td>${l.label}</td><td>${l.m}</td><td>${mmss(l.s)}</td><td>${l.pace}</td><td>${l.hr}</td><td>${l.max}</td><td>${l.cad}</td></tr>`)}</tbody></table><//>
  <${Card} c="mb-4"><div class="font-semibold mb-2">Zones FC</div>${[["Z1",8],["Z2",22],["Z3",18],["Z4",42],["Z5",10]].map(z=>h`<div key=${z[0]} class="flex items-center gap-2 mb-1 text-sm"><span class="w-8">${z[0]}</span><div class="bar flex-1"><i style=${{width:z[1]+"%"}}/></div><span class="w-10 mut">${z[1]}%</span></div>`)}<//>
  <button class="btn" onClick=${()=>go("Débriefe la séance « "+a.name+" » du "+a.date)}>🤖 Débriefer cette séance dans AI Coach</button></div>`}
 return h`<div><${Title}>Agenda & Séances<//>
 <div class="flex flex-wrap justify-between items-center mb-3"><h3 class="font-semibold">Calendrier · 2 semaines passées & 2 à venir</h3><button class="btn" onClick=${ics}>📥 Exporter tout l’agenda (.ics)</button></div>
 <div class="mb-8"><${Cal} ev=${X.ev} acts=${X.done} pick=${pick} onEv=${setPick} onAct=${setS}/>
 ${pick&&h`<${Card} c="mt-4"><div class="flex justify-between"><div><div class="mut text-xs">${pick.date}</div><div class="hd text-2xl">${pick.name}</div></div><button onClick=${()=>setPick(null)}>✕</button></div><div class="text-sm space-y-1 mt-2">${pick.warmup&&h`<div><b class="ac">Warmup</b> ${pick.warmup}</div>`}<div><b class="ac">Main Set</b> ${pick.main}</div>${pick.cooldown&&h`<div><b class="ac">Cooldown</b> ${pick.cooldown}</div>`}</div><div class="mut text-sm mt-2">${pick.km} km · charge ${pick.load}</div><div class="flex flex-wrap gap-2 mt-3"><a class="btn2" target="_blank" href=${gcal(pick)}>📅 Ajouter à Google Agenda</a>${pick.ia&&h`<input type="date" class="inp !w-auto" value=${pick.date} onChange=${e=>{X.setEv(X.ev.map(x=>x.id===pick.id?{...x,date:e.target.value}:x));setPick({...pick,date:e.target.value})}}/>`}<button class="btn2" onClick=${()=>{X.setEv(X.ev.filter(x=>x.id!==pick.id));setPick(null)}}>🗑 Supprimer</button></div><//>`}</div>
 <h3 class="font-semibold mb-3">Dernières séances synchronisées</h3>
 <${Card} c="tw"><table><thead><tr>${["Date","Nom","km","Allure","FC moy/max","Load"].map(x=>h`<th key=${x}>${x}</th>`)}</tr></thead><tbody>${X.done.map(a=>h`<tr key=${a.id} class="cursor-pointer" onClick=${()=>setS(a)}><td>${a.date}</td><td class="font-medium">${a.name}</td><td>${a.km}</td><td>${a.pace}/km</td><td>${a.hr}/${a.hrmax}</td><td class="ac">${a.load}</td></tr>`)}</tbody></table><//></div>`}

const R=(i,k)=>Math.abs(Math.sin(i*12.9898+k*78.233)*43758.5453%1);
const Kpi=k=>h`<div class="card !p-3 tip" key=${k[0]}><div class="tt">${TIP[k[0]]||TIP[k[0].replace(" 2026","")]||""}</div><div class="mut text-xs">${k[0]} ⓘ</div><div class="hd text-2xl">${k[1]}<span class="text-xs mut font-normal"> ${k[2]||""}</span></div>${k[3]&&h`<div class="text-xs" style=${{color:k[3][0]==="−"?"var(--wr)":"var(--ac)"}}>${k[3]}</div>`}</div>`;
const Grp=(t,it)=>h`<section class="mb-8" key=${t}><h3 class="hd text-2xl mb-3">${t}</h3><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">${it.map(k=>Kpi(k))}</div></section>`;
function Bars({d,H=120,lab}){const mx=Math.max(...d),w=600/d.length;return h`<svg viewBox="0 0 600 ${H+18}" class="w-full"><defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style=${{stopColor:"var(--ac)"}}/><stop offset="1" style=${{stopColor:"var(--ac2)",stopOpacity:.4}}/></linearGradient></defs>${d.map((v,i)=>h`<g key=${i}><rect x=${i*w+3} y=${H-v/mx*H} width=${w-6} height=${v/mx*H} rx="5" fill="url(#gg)"/>${lab&&h`<text x=${i*w+w/2} y=${H+14} text-anchor="middle" font-size="10" fill="var(--mut)">${lab[i]}</text>`}</g>`)}</svg>`}
const Heat=()=>h`<svg viewBox="0 0 340 140" class="w-full">${Array.from({length:119},(_,i)=>{const v=R(i,9);return h`<rect key=${i} x=${(i/7|0)*20} y=${(i%7)*20} width="16" height="16" rx="4" fill="var(--ac)" opacity=${v>.3?(.25+v*.75).toFixed(2):.08}/>`})}</svg>`;
const ZB=(t,z)=>h`<${Card} c="mb-3" key=${t}><div class="font-semibold mb-2">${t}</div>${z.map(x=>h`<div key=${x[0]} class="flex items-center gap-2 mb-1 text-sm"><span class="w-8">${x[0]}</span><div class="bar flex-1"><i style=${{width:x[1]*1.6+"%"}}/></div><span class="w-10 mut">${x[1]}%</span></div>`)}<//>`;
function Stats(){
 const [p,setP]=useState(28),N=90,ser=(b,a,k,t=0)=>Array.from({length:N},(_,i)=>b+t*i/N+Math.sin(i/4+k)*a+(R(i,k)-.5)*a);
